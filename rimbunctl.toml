[fragments.ensure-profile-db.services.backend]
workdir = "."
bootstrap = "docker compose exec -T postgres psql -U postgres -d postgres -c \"SELECT 'CREATE DATABASE {db_name}' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{db_name}')\\\\gexec\""

[fragments.production-runtime.services.embedding]
workdir = "."
run = "cargo run --release -p rimbun-embedding-service --bin rimbun-embedding-service"

[fragments.production-runtime.services.backend]
workdir = "."
run = "cargo run --release -p rimbun-api --bin rimbun-api"

[fragments.production-runtime.services.frontend]
workdir = "web"
bootstrap = "npm install && npm run build"
run = "python3 -m http.server {frontend_port} --bind 127.0.0.1 --directory dist < /dev/null"

[fragments.project_quran]
vars.project_name = "quran"
vars.db_prefix = "quran_translations"

[fragments.project_feature_requests]
vars.project_name = "feature_requests"
vars.db_prefix = "rimbun_feature_requests"

[fragments.project_benaristan]
vars.project_name = "benaristan"
vars.db_prefix = "benaristan"

[profiles.quran-dev]
extends = ["local-docker", "rimbun-local", "ensure-profile-db", "project_quran"]
state_namespace = "quran-dev"
vars.db_name = "quran_translations_dev"
vars.backend_port = "3000"
vars.frontend_port = "5173"
vars.embedding_port = "8001"

[profiles.quran-test]
extends = ["local-docker", "rimbun-local", "ensure-profile-db", "project_quran"]
state_namespace = "quran-test"
vars.db_name = "quran_translations_test"
