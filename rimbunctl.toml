[fragments.ensure-profile-db.services.backend]

[fragments.production-runtime.services.embedding]
workdir = "."
run = "cargo run --release -p rimbun-embedding-service --bin rimbun-embedding-service"

[fragments.production-runtime.services.backend]
workdir = "."
run = "cargo run --release -p rimbun-api --bin rimbun-api"

[fragments.server-single-host]
vars.deploy_root = "/srv/rimbun"
env.DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:5432/{db_name}"
env.RIMBUN_PORT = "{backend_port}"
env.RIMBUN_EMBEDDING_PORT = "{embedding_port}"
env.EMBEDDING_SERVICE_URL = "http://127.0.0.1:{embedding_port}"

[fragments.project_quran]
vars.project_name = "quran"
vars.db_prefix = "quran_translations"

[fragments.project_feature_requests]
vars.project_name = "feature_requests"
vars.db_prefix = "rimbun_feature_requests"

[fragments.project_benaristan]
vars.project_name = "benaristan"
vars.db_prefix = "benaristan"

[profiles.quran-dev]
extends = ["local-docker", "rimbun-local", "ensure-profile-db", "project_quran"]
state_namespace = "quran-dev"
vars.db_name = "quran_translations_dev"
vars.backend_port = "3000"
vars.frontend_port = "5173"
vars.embedding_port = "8001"

[profiles.quran-test]
extends = ["local-docker", "rimbun-local", "ensure-profile-db", "project_quran"]
state_namespace = "quran-test"
vars.db_name = "quran_translations_test"
vars.backend_port = "3001"
vars.frontend_port = "5174"
vars.embedding_port = "8002"

[profiles.quran-prod]
extends = ["server-single-host", "production-runtime", "project_quran"]
state_namespace = "quran-prod"
vars.db_name = "quran_translations_prod"
vars.backend_port = "3002"
vars.embedding_port = "8003"
vars.site_domain = "translations.ropeofgod.org"
vars.frontend_root = "/srv/rimbun/sites/quran-prod/current"

[profiles.feature-requests-dev]
extends = ["local-docker", "rimbun-local", "ensure-profile-db", "project_feature_requests"]
state_namespace = "feature-requests-dev"
vars.db_name = "rimbun_feature_requests_dev"
vars.backend_port = "3010"
vars.frontend_port = "5183"
vars.embedding_port = "8011"

[profiles.feature-requests-test]
extends = ["local-docker", "rimbun-local", "ensure-profile-db", "project_feature_requests"]
state_namespace = "feature-requests-test"
vars.db_name = "rimbun_feature_requests_test"
vars.backend_port = "3011"
vars.frontend_port = "5184"
vars.embedding_port = "8012"

[profiles.feature-requests-prod]
extends = ["server-single-host", "production-runtime", "project_feature_requests"]
state_namespace = "feature-requests-prod"
vars.db_name = "rimbun_feature_requests_prod"
vars.backend_port = "3012"
vars.embedding_port = "8013"
vars.site_domain = "docs.rimbun.org"
vars.frontend_root = "/srv/rimbun/sites/feature-requests-prod/current"

[profiles.benaristan-dev]
extends = ["local-docker", "rimbun-local", "ensure-profile-db", "project_benaristan"]
state_namespace = "benaristan-dev"
vars.db_name = "benaristan_dev"
vars.backend_port = "3020"
vars.frontend_port = "5193"
vars.embedding_port = "8021"

[profiles.benaristan-test]
extends = ["local-docker", "rimbun-local", "ensure-profile-db", "project_benaristan"]
state_namespace = "benaristan-test"
vars.db_name = "benaristan_test"
vars.backend_port = "3021"
vars.frontend_port = "5194"
vars.embedding_port = "8022"

[profiles.benaristan-prod]
extends = ["server-single-host", "production-runtime", "project_benaristan"]
state_namespace = "benaristan-prod"
vars.db_name = "benaristan_prod"
vars.backend_port = "3022"
vars.embedding_port = "8023"
vars.site_domain = "docs.benaristan.org"
vars.frontend_root = "/srv/rimbun/sites/benaristan-prod/current"
